name: release
on:
  push:
    branches: [$default-branch]
permissions: {}
jobs:
  release:
    uses: fiscalis-ai/.github/.github/workflows/release.yml@v1
    secrets: inherit

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "Build and publish ${{ needs.release.outputs.tag }}"
